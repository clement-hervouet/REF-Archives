# Stack de production de REF-Archives (CLAUDE.md §6.7, §10.2 ; procédure : docs/deploy.md).
#
# Sur le serveur, `.env` (à côté de ce fichier, chmod 600, jamais versionné) définit
# `COMPOSE_FILE=compose.prod.yml` : les commandes s'écrivent donc simplement `docker compose …`.
#
# Réseaux :
#   internal      : app + db, sans accès à Internet ; la base n'est JAMAIS publiée.
#   caddy_default : réseau du projet Compose de Caddy (externe). L'app y est joignable par
#                   Caddy (`ref-archives-app:3000`) et y joint le relais postfix. Aucun `ports:` sur l'app :
#                   Caddy est le seul point d'entrée (M1, docs/deploy.md).

name: ref-archives

x-app-env: &app-env
  NODE_ENV: production
  # Construite ici à partir des mêmes valeurs que le service `db` : une seule source de vérité.
  DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  AUTH_SECRET: ${AUTH_SECRET:?}
  APP_URL: ${APP_URL:?}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:?}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:?}
  CRON_SECRET: ${CRON_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: ref-archives-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    networks:
      internal:
      caddy:
        # Nom unique sur caddy_default, partagé avec d'autres projets : un service `app` d'un
        # autre projet rendrait le nom `app` ambigu pour Caddy.
        aliases:
          - ref-archives-app
    # Durcissement : système de fichiers en lecture seule (sauf le cache Next.js et /tmp),
    # aucune capacité Linux, pas d'élévation de privilèges.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Outils ponctuels, jamais démarrés par `docker compose up` (profil) :
  #   docker compose run --rm tools node scripts/db.mts migrate
  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
    image: ref-archives-tools:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    # `caddy` : pour que `scripts/email-test.mts` joigne le relais postfix.
    networks:
      - internal
      - caddy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  caddy:
    external: true
    name: caddy_default

volumes:
  pgdata:
